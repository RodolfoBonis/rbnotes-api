name: CI

# Push só no main (o CD depende deste run); branches de PR rodam via pull_request, para não
# disparar o CI duas vezes. Repo público: roda em runners hospedados pelo GitHub (ubuntu-latest).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GO_VERSION: "1.26.x"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m
          skip-cache: false
      - name: go vet
        run: go vet ./...

  codegen:
    name: Codegen + contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # sqlc: o código gerado (db/gen) deve estar sincronizado com db/query + db/migrations.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: sqlc generate + diff
        run: |
          "$(go env GOPATH)/bin/sqlc" generate
          git diff --exit-code db/gen \
            || (echo "::error::db/gen desatualizado — rode 'make gen' e commite"; exit 1)
      # OpenAPI: o contrato é a fonte dos tipos do desktop; lint impede quebra silenciosa.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: OpenAPI lint
        run: npx --yes --registry=https://registry.npmjs.org @redocly/cli@1.34.2 lint api/openapi.yaml

  test:
    name: Build + tests (race)
    runs-on: ubuntu-latest
    # ubuntu-latest traz Docker: os testes de integração com testcontainers rodam no CI — sem -short.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go test (race, com testcontainers)
        run: go test -race -count=1 ./...
