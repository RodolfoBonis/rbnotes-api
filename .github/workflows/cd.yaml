name: cd

# workflow_run NÃO suporta filtro por paths. O loop do bump de version.txt é cortado pelo marcador
# [skip ci] na mensagem de commit, checado abaixo.
on:
  workflow_run:
    workflows: ['CI']
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  get_commit_messages:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && !contains(github.event.workflow_run.head_commit.message, '[skip ci]') }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}
          fetch-depth: 0
      - name: Get commit information
        id: commit_info
        run: |
          pr_info=$(gh pr list --state merged --limit 1 --json number,title,body,mergeCommit)
          if [ "$(echo "$pr_info" | jq '. | length')" -gt 0 ] && [ "$(echo "$pr_info" | jq -r '.[0].mergeCommit.oid')" = "$(git rev-parse HEAD)" ]; then
            pr_number=$(echo "$pr_info" | jq -r '.[0].number')
            echo "Pull Request #$pr_number" > commit_messages.txt
            echo "$(echo "$pr_info" | jq -r '.[0].title')" >> commit_messages.txt
          else
            echo "Direct Push to Main" > commit_messages.txt
            git log -1 --pretty=format:"%s%n%n%b" >> commit_messages.txt
          fi
      - name: Upload commit messages
        uses: actions/upload-artifact@v4
        with:
          name: commit-messages
          path: commit_messages.txt

  build_and_deploy:
    needs: get_commit_messages
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && !contains(github.event.workflow_run.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ env.VERSION }}
    steps:
      - name: Install aws CLI and yq
        run: |
          mkdir -p "$HOME/.local/bin"
          if ! command -v aws >/dev/null; then
            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscli.zip
            unzip -q /tmp/awscli.zip -d /tmp
            /tmp/aws/install -i "$HOME/.local/aws-cli" -b "$HOME/.local/bin"
          fi
          if ! command -v yq >/dev/null; then
            curl -fsSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o "$HOME/.local/bin/yq"
            chmod +x "$HOME/.local/bin/yq"
          fi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup ArgoCD CLI
        uses: imajeetyadav/argocd-cli@v1

      - name: Increment version
        run: |
          bash ./.config/scripts/increment_version.sh
          echo "VERSION=$(cat version.txt)" >> $GITHUB_ENV

      - name: Add, commit and push version increment
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add version.txt
          if git diff --cached --quiet; then echo "No version changes"; exit 0; fi
          git commit -m "chore(release): increment version [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          for repo in rbnotes-api rbnotes-ai-worker; do
            aws ecr describe-repositories --repository-names "rodolfobonis/$repo" >/dev/null 2>&1 \
              || aws ecr create-repository --repository-name "rodolfobonis/$repo" >/dev/null
          done

      - name: Preset Image Name
        run: |
          registry="${{ steps.login-ecr.outputs.registry }}"
          echo "API_IMAGE=$(echo $registry/rodolfobonis/rbnotes-api:${{ env.VERSION }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "AI_IMAGE=$(echo $registry/rodolfobonis/rbnotes-ai-worker:${{ env.VERSION }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "CLAUDE_CODE_VERSION=$(npm view @anthropic-ai/claude-code version)" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/rodolfobonis/rbnotes-api:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/rodolfobonis/rbnotes-api:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      # ai-worker: imagem própria (node:22-slim + CLI do Claude Code), mesma versão da API.
      - name: Build and push ai-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ai-worker
          push: true
          tags: ${{ env.AI_IMAGE }}
          build-args: |
            CLAUDE_CODE_VERSION=${{ env.CLAUDE_CODE_VERSION }}
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/rodolfobonis/rbnotes-ai-worker:buildcache
          cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/rodolfobonis/rbnotes-ai-worker:buildcache,mode=max,image-manifest=true,oci-mediatypes=true

      - name: Checkout k3s manifest repository
        uses: actions/checkout@v4
        with:
          repository: RodolfoBonis/k3s-apps
          ref: main
          path: k3s-manifest
          token: ${{ secrets.GH_TOKEN }}

      - name: Update k3s manifests with new image version
        run: |
          cd k3s-manifest
          yq e -i ".\"web-server\".image.tag = \"${{ env.VERSION }}\"" ./apps/rbnotes/values-api-prod.yaml
          yq e -i "(.worker.workers[] | select(.name == \"ai-worker\") | .image.tag) = \"${{ env.VERSION }}\"" ./apps/rbnotes/values-api-prod.yaml
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ./apps/rbnotes/values-api-prod.yaml
          git commit -m "rbnotes: bump api image to ${{ env.VERSION }}"
          git pull --rebase origin main
          git push

      - name: Sync ArgoCD Application
        run: |
          argocd app sync rbnotes-api-prod --grpc-web \
            --server ${{ secrets.ARGOCD_SERVER }} \
            --auth-token ${{ secrets.ARGOCD_TOKEN }}

      - name: Create Tag for Release
        id: create_tag
        if: ${{ job.status == 'success' }}
        run: echo "tag=v${{ env.VERSION }}" >> $GITHUB_OUTPUT

      - name: Download commit messages
        uses: actions/download-artifact@v4
        with:
          name: commit-messages
          path: .

      - name: Create Release
        if: ${{ job.status == 'success' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.create_tag.outputs.tag }}
          name: Release ${{ env.VERSION }}
          body_path: commit_messages.txt
          draft: false
          prerelease: false
          token: ${{ github.token }}

  notify:
    needs: build_and_deploy
    runs-on: ubuntu-latest
    if: always()
    steps:
      - if: ${{ needs.build_and_deploy.result == 'success' }}
        name: Send Success Message via Telegram
        uses: appleboy/telegram-action@v1.0.1
        with:
          token: ${{ secrets.BOTTOKEN }}
          to: ${{ secrets.CHAT_ID }}
          message: |
            Deployment do RbNotes API concluído
            Versão: ${{ needs.build_and_deploy.outputs.version }}
            Repositório: ${{ github.repository }}

      - if: ${{ needs.build_and_deploy.result != 'success' }}
        name: Send Failure Message via Telegram
        uses: appleboy/telegram-action@v1.0.1
        with:
          token: ${{ secrets.BOTTOKEN }}
          to: ${{ secrets.CHAT_ID }}
          message: |
            Deployment do RbNotes API falhou
            Repositório: ${{ github.repository }}
            Logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
