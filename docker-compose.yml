services:
  postgres:
    image: postgres:17-alpine
    container_name: rbnotes-postgres
    environment:
      POSTGRES_USER: rbnotes
      POSTGRES_PASSWORD: rbnotes
      POSTGRES_DB: rbnotes
    ports:
      - "5432:5432"
    volumes:
      - rbnotes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rbnotes -d rbnotes"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rbnotes-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rbnotes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: rbnotes
      MINIO_ROOT_PASSWORD: rbnotes-dev-secret
    ports:
      - "9000:9000" # API S3
      - "9001:9001" # console web
    volumes:
      - rbnotes_minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  rbnotes_pgdata:
  rbnotes_minio:
